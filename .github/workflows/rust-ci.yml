# Dosya Yolu: REPO_ROOT/.github/workflows/rust-ci.yml
# Amac: Rust native motor CLI ve GUI build/test
# Modul - FileType: CI - YAML
# Version: 0.3.1
# Aciklama: Uretim release olmadan test artifactlari
# Bagimli Oldugu Katman: Tool | Config

name: rust-native-ci
on:
  push:
    branches:
      - feat/rust-native-v0.3.1
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-cli:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check core and CLI
        run: cargo check --bins
      - name: Rust unit and contract tests
        run: cargo test --lib --test rust_compat
      - name: Install pinned official YARA-X
        shell: pwsh
        run: ./tools/install-yarax.ps1
      - name: Rust real YARA-X end-to-end
        run: cargo test --test yarax_e2e
      - name: Rust lint
        run: cargo clippy --lib --bin turkuazav --tests -- -D warnings
      - name: Build release CLI
        run: cargo build --release --bin turkuazav

  native-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux GUI prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev libudev-dev
      - name: Check Rust GUI
        run: cargo check --features desktop --bin turkuazav-desktop
      - name: Compile native GUI
        run: cargo build --release --features desktop --bin turkuazav-desktop
      - name: Verify native test binary and SHA256
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { 'target/release/turkuazav-desktop.exe' } else { 'target/release/turkuazav-desktop' }
          if (!(Test-Path $binary)) { throw "Missing GUI binary: $binary" }
          Get-FileHash -Algorithm SHA256 $binary | Format-List
      - name: Upload unsigned Windows GUI test artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TurkuazAV-0.3.1-RUST-UNSIGNED-TEST-win-x64
          path: target/release/turkuazav-desktop.exe
          retention-days: 7
          if-no-files-found: error
