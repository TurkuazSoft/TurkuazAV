# Dosya Yolu: REPO_ROOT/.github/workflows/rust-format-once.yml
# Amac: Yalnizca gecis dalinda rustfmt patchini commit etmek
# Modul - FileType: CI - YAML
# Version: 0.3.1
# Aciklama: Ana dala dokunmayan gecici migration format adimi
# Bagimli Oldugu Katman: Tool

name: rust-migration-format-once
on:
  push:
    branches: [feat/rust-native-v0.3.1]

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/feat/rust-native-v0.3.1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit migration formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/src tests/rust_compat.rs
          if ! git diff --cached --quiet; then
            git commit -m "style(rust): apply rustfmt for native migration"
            git push origin HEAD:feat/rust-native-v0.3.1
          fi
