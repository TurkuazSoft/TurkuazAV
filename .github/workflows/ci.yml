name: cross-platform-ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  smoke-and-yarax-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore CLI
        run: dotnet restore src/TurkuazAV.Cli/TurkuazAV.Cli.csproj
      - name: Restore smoke tests
        run: dotnet restore tests/TurkuazAV.SmokeTests/TurkuazAV.SmokeTests.csproj
      - name: Restore integration tests
        run: dotnet restore tests/TurkuazAV.IntegrationTests/TurkuazAV.IntegrationTests.csproj
      - name: Build CLI
        run: dotnet build src/TurkuazAV.Cli/TurkuazAV.Cli.csproj --configuration Release --no-restore
      - name: Run smoke tests
        run: dotnet run --project tests/TurkuazAV.SmokeTests --configuration Release --no-restore
      - name: Verify and extract official YARA-X
        shell: pwsh
        run: ./tools/install-yarax.ps1
      - name: Real YARA-X end-to-end tests
        run: dotnet run --project tests/TurkuazAV.IntegrationTests --configuration Release --no-restore
